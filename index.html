<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Karir - Kampung Inggris Pontianak</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #fcfcfc;
    }

    .input-field {
      border: 1px solid #d1d5db;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      margin-top: 6px;
      outline: none;
      background-color: #ffffff;
      transition: all 0.3s;
    }

    .input-field:focus {
      border-color: #dc2626;
      box-shadow: 0 10px 15px -3px rgba(220, 38, 38, 0.1);
      transform: translateY(-3px);
    }

    input[type="file"]::file-selector-button {
      background-color: #111827;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      margin-right: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    input[type="file"]::file-selector-button:hover {
      background-color: #dc2626;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-gray-900 antialiased selection:bg-red-200 selection:text-red-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /**
     * GITHUB MIGRATION CONFIG
     * 1. Deploy Code_GitHub_API.gs as a Google Apps Script Web App.
     * 2. Copy the Web App URL below.
     * 3. Put this file in GitHub Pages as index.html.
     *
     * Important: API calls use Content-Type text/plain to avoid GAS CORS preflight.
     */
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby_-gE8430wOvKXPjTtridaEQPo14xealdvQcAN1D7ZkhqJLGzrvxIUKmkFx5467sMg/exec';

    const ROUTES = {
      admin: './admin.html',
      pelamar: './pelamar.html'
    };

    const STORAGE_KEYS = {
      adminUsername: 'hr_username',
      adminPassword: 'hr_password',
      activeApplicantId: 'id_pelamar_aktif'
    };

    async function callGasApi(action, params = []) {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL === 'PASTE_YOUR_GAS_WEB_APP_URL_HERE') {
        throw new Error('GAS_WEB_APP_URL belum diisi. Masukkan URL deployment Web App dari Apps Script.');
      }

      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({ action, params })
      });

      if (!response.ok) {
        throw new Error(`Server merespons HTTP ${response.status}`);
      }

      const text = await response.text();
      try {
        return JSON.parse(text);
      } catch (error) {
        throw new Error('Respons server bukan JSON valid: ' + text.slice(0, 160));
      }
    }

    function JobPortal() {
      const [formFields, setFormFields] = useState([]);
      const [isLoadingForm, setIsLoadingForm] = useState(true);
      const [formData, setFormData] = useState({ agreement: false });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [dialog, setDialog] = useState({ isOpen: false, type: 'success', title: '', message: '' });

      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginType, setLoginType] = useState('Admin');
      const [loginData, setLoginData] = useState({ username: '', password: '', idPelamar: '', rememberMe: false });
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const [loginStatus, setLoginStatus] = useState({ type: '', message: '' });
      const [targetUrl, setTargetUrl] = useState('');

      useEffect(() => {
        loadFormSettings();
        loadRememberedAdminLogin();
      }, []);

      const loadFormSettings = async () => {
        setIsLoadingForm(true);
        try {
          const res = await callGasApi('getFormSettings');
          if (res.success) {
            setFormFields(Array.isArray(res.data) ? res.data : []);
          } else {
            setDialog({
              isOpen: true,
              type: 'error',
              title: 'Gagal Memuat Form',
              message: res.message || 'Pengaturan form tidak dapat dimuat.'
            });
          }
        } catch (error) {
          setDialog({
            isOpen: true,
            type: 'error',
            title: 'Koneksi Backend Gagal',
            message: error.message
          });
        } finally {
          setIsLoadingForm(false);
        }
      };

      const loadRememberedAdminLogin = () => {
        const savedUser = localStorage.getItem(STORAGE_KEYS.adminUsername);
        const savedPass = localStorage.getItem(STORAGE_KEYS.adminPassword);
        if (savedUser && savedPass) {
          setLoginData(prev => ({
            ...prev,
            username: savedUser,
            password: savedPass,
            rememberMe: true
          }));
        }
      };

      const saveRememberedAdminLogin = () => {
        if (loginData.rememberMe) {
          localStorage.setItem(STORAGE_KEYS.adminUsername, loginData.username);
          localStorage.setItem(STORAGE_KEYS.adminPassword, loginData.password);
        } else {
          localStorage.removeItem(STORAGE_KEYS.adminUsername);
          localStorage.removeItem(STORAGE_KEYS.adminPassword);
        }
      };

      const handleLoginClick = (type) => {
        setLoginType(type);
        setShowLoginModal(true);
        setLoginStatus({ type: '', message: '' });
        setTargetUrl('');
      };

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setIsLoggingIn(true);
        setLoginStatus({ type: '', message: '' });
        setTargetUrl('');

        try {
          if (loginType === 'Admin') {
            const res = await callGasApi('verifyAdminLogin', [loginData.username, loginData.password]);

            if (res.success) {
              saveRememberedAdminLogin();
              sessionStorage.setItem('admin_login_verified', 'true');
              setLoginStatus({ type: 'success', message: 'Verifikasi sukses! Silakan masuk.' });
              setTargetUrl(ROUTES.admin);
            } else {
              setLoginStatus({ type: 'error', message: res.message || 'Username atau password salah.' });
            }
          } else {
            const applicantId = String(loginData.idPelamar || '').trim();
            const res = await callGasApi('verifyPelamarLogin', [applicantId]);

            if (res.success) {
              localStorage.setItem(STORAGE_KEYS.activeApplicantId, applicantId);
              setLoginStatus({ type: 'success', message: 'ID Valid! Membuka dashboard tes...' });
              setTargetUrl(ROUTES.pelamar);
            } else {
              setLoginStatus({ type: 'error', message: res.message || 'ID Pelamar tidak valid.' });
            }
          }
        } catch (error) {
          setLoginStatus({ type: 'error', message: error.message });
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value
        }));
      };

      const handleFileChange = (e, fieldName) => {
        const file = e.target.files[0];

        if (!file) {
          setFormData(prev => {
            const updated = { ...prev };
            delete updated[fieldName];
            return updated;
          });
          return;
        }

        const allowedTypes = [
          'application/pdf',
          'application/msword',
          'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
        ];

        if (!allowedTypes.includes(file.type)) {
          e.target.value = '';
          setDialog({
            isOpen: true,
            type: 'error',
            title: 'Format Berkas Tidak Valid',
            message: 'Gunakan file PDF, DOC, atau DOCX.'
          });
          return;
        }

        const maxSizeMb = 10;
        if (file.size > maxSizeMb * 1024 * 1024) {
          e.target.value = '';
          setDialog({
            isOpen: true,
            type: 'error',
            title: 'Ukuran Berkas Terlalu Besar',
            message: `Ukuran maksimal file adalah ${maxSizeMb} MB.`
          });
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          const base64Data = event.target.result.split(',')[1];
          setFormData(prev => ({
            ...prev,
            [fieldName]: {
              name: file.name,
              mimeType: file.type,
              data: base64Data
            }
          }));
        };
        reader.onerror = () => {
          setDialog({
            isOpen: true,
            type: 'error',
            title: 'Gagal Membaca File',
            message: 'File tidak dapat diproses oleh browser. Coba unggah ulang.'
          });
        };
        reader.readAsDataURL(file);
      };

      const validateRequiredFiles = () => {
        const activeFiles = formFields.filter(field => field.active && field.type === 'file' && field.required);

        for (const fileField of activeFiles) {
          if (!formData[fileField.name]) {
            setDialog({
              isOpen: true,
              type: 'error',
              title: 'Berkas Kurang!',
              message: `Harap unggah dokumen untuk: ${fileField.label}`
            });
            return false;
          }
        }

        return true;
      };

        const normalizeIndonesianWa = (value) => {
          if (!value) return '';
        
          let number = String(value).trim();
        
          // Remove all non-digits: spaces, +, -, (), dots, etc.
          number = number.replace(/\D/g, '');
        
          // Handle international prefix: 00628xxxx -> 628xxxx
          if (number.startsWith('0062')) {
            number = '62' + number.slice(4);
          }
        
          // Handle broken format: 6208xxxx -> 628xxxx
          if (number.startsWith('6208')) {
            number = '62' + number.slice(3);
          }
        
          // Handle local format: 08xxxx -> 628xxxx
          if (number.startsWith('0')) {
            number = '62' + number.slice(1);
          }
        
          // Handle missing country code: 8xxxx -> 628xxxx
          if (number.startsWith('8')) {
            number = '62' + number;
          }
        
          return number;
        };
        
        const normalizeTelFields = (data) => {
          const normalizedData = { ...data };
        
          formFields
            .filter((field) => field.active && field.type === 'tel')
            .forEach((field) => {
              normalizedData[field.name] = normalizeIndonesianWa(data[field.name]);
            });
        
          return normalizedData;
        };
        
        const handleSubmit = async (e) => {
          e.preventDefault();
        
          if (!validateRequiredFiles()) return;
        
          setIsSubmitting(true);
        
          try {
            const normalizedFormData = normalizeTelFields(formData);
        
            const res = await callGasApi('processForm', [normalizedFormData]);
        
            if (res.success) {
              setDialog({
                isOpen: true,
                type: 'success',
                title: 'Lamaran Terkirim! 🎉',
                message: 'Seluruh data dan berkas Anda telah tersimpan dengan aman di sistem kami.'
              });
              setFormData({ agreement: false });
              e.target.reset();
            } else {
              setDialog({
                isOpen: true,
                type: 'error',
                title: 'Pengiriman Gagal',
                message: res.message || 'Data belum berhasil dikirim.'
              });
            }
          } catch (error) {
            setDialog({
              isOpen: true,
              type: 'error',
              title: 'Koneksi Terputus',
              message: 'Terjadi kesalahan jaringan: ' + error.message
            });
          } finally {
            setIsSubmitting(false);
          }
        };

      const renderField = (field) => {
        if (!field.active) return null;

        const fieldName = field.name;
        const fieldLabel = field.label || fieldName;
        const required = Boolean(field.required);

        switch (field.type) {
          case 'textarea':
            return (
              <textarea
                name={fieldName}
                value={formData[fieldName] || ''}
                onChange={handleChange}
                className="input-field resize-none"
                rows="3"
                placeholder={`Masukkan ${fieldLabel.toLowerCase()}...`}
                required={required}
              ></textarea>
            );

          case 'select':
            const options = String(field.options || '')
              .split(',')
              .map(option => option.trim())
              .filter(Boolean);

            return (
              <select
                name={fieldName}
                value={formData[fieldName] || ''}
                onChange={handleChange}
                className="input-field cursor-pointer"
                required={required}
              >
                <option value="" disabled>Pilih {fieldLabel}...</option>
                {options.map((option, index) => (
                  <option key={`${fieldName}-${index}`} value={option}>{option}</option>
                ))}
              </select>
            );

          case 'file':
            return (
              <input
                type="file"
                accept=".pdf,.doc,.docx"
                onChange={(event) => handleFileChange(event, fieldName)}
                className="input-field"
                required={required}
              />
            );

          default:
            return (
              <input
                type={field.type || 'text'}
                name={fieldName}
                value={formData[fieldName] || ''}
                onChange={handleChange}
                className="input-field"
                placeholder={`Masukkan ${fieldLabel.toLowerCase()}`}
                required={required}
              />
            );
        }
      };

      return (
        <div>
          <nav className="max-w-4xl mx-auto py-6 px-6 flex justify-between items-center border-b border-gray-200">
            <div className="flex items-center space-x-3 cursor-pointer group">
              <img
                src="https://drive.google.com/thumbnail?id=1Pn3HnYmsXNA4omqf_PPUYZfeDon1WMNz&sz=w1000"
                alt="Logo Perusahaan"
                className="h-12 w-auto rounded group-hover:opacity-80 transition object-contain"
              />
              <h1 className="text-xl font-bold tracking-tight hidden sm:block text-gray-900 group-hover:text-red-600 transition">
                Kampung Inggris Pontianak
              </h1>
            </div>

            <div className="space-x-4 flex items-center">
              <button
                type="button"
                onClick={() => handleLoginClick('Pelamar')}
                className="text-sm font-semibold text-gray-600 hover:text-red-600 transition"
              >
                Login Pelamar
              </button>
              <button
                type="button"
                onClick={() => handleLoginClick('Admin')}
                className="px-5 py-2.5 bg-black text-white text-sm font-bold rounded-lg hover:bg-red-600 transition shadow-md hover:shadow-lg transform hover:-translate-y-0.5"
              >
                Login Admin
              </button>
            </div>
          </nav>

          <main className="max-w-2xl mx-auto py-12 px-6">
            <header className="mb-10 text-center">
              <h2 className="text-3xl font-extrabold mb-3 text-black">Formulir Aplikasi</h2>
              <div className="w-16 h-1 bg-red-600 mx-auto mb-4 rounded-full"></div>
              <p className="text-gray-500 font-medium">
                Silakan lengkapi data diri Anda untuk melamar posisi yang tersedia.
              </p>
            </header>

            {isLoadingForm ? (
              <div className="text-center py-20 text-gray-500 font-semibold animate-pulse">
                Menyiapkan formulir...
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-6">
                {formFields.filter(field => field.active).map((field) => (
                  <section key={field.id || field.name} className="animate-[fadeIn_0.5s_ease-out]">
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-700">
                      {field.label} {field.required && <span className="text-red-500">*</span>}
                    </label>
                    {renderField(field)}
                  </section>
                ))}

                <section className="bg-gray-50 p-4 rounded-lg border border-gray-100 mt-8">
                  <label className="flex items-start space-x-3 cursor-pointer">
                    <input
                      type="checkbox"
                      name="agreement"
                      checked={formData.agreement || false}
                      onChange={handleChange}
                      className="mt-1 w-5 h-5 text-red-600 bg-white border-gray-300 rounded focus:ring-red-500 focus:ring-2 cursor-pointer transition"
                      required
                    />
                    <span className="text-sm text-gray-600 leading-relaxed">
                      Dengan ini saya menyatakan bahwa seluruh data dan dokumen yang saya lampirkan adalah <strong>benar dan dapat dipertanggungjawabkan</strong>. Saya bersedia mengikuti seluruh tahapan proses seleksi sesuai aturan perusahaan.
                    </span>
                  </label>
                </section>

                <button
                  type="submit"
                  disabled={isSubmitting}
                  className={`w-full py-4 text-white font-bold rounded-xl transition-all duration-300 shadow-md ${isSubmitting ? 'bg-gray-400 cursor-not-allowed' : 'bg-red-600 hover:bg-red-700 hover:shadow-lg transform hover:-translate-y-1'}`}
                >
                  {isSubmitting ? 'MENGIRIM DATA...' : 'KIRIM LAMARAN'}
                </button>
              </form>
            )}
          </main>

          {showLoginModal && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
              <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm relative">
                <button
                  type="button"
                  onClick={() => setShowLoginModal(false)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-red-600 font-bold text-2xl transition"
                >
                  ×
                </button>

                <div className="flex flex-col items-center mb-6">
                  <div className={`w-12 h-12 text-white rounded-full flex items-center justify-center font-bold text-xl mb-3 ${loginType === 'Admin' ? 'bg-black' : 'bg-red-600'}`}>
                    {loginType === 'Admin' ? 'A' : 'P'}
                  </div>
                  <h3 className="text-2xl font-extrabold text-gray-900">Login {loginType}</h3>
                </div>

                <form onSubmit={handleLoginSubmit} className="space-y-5">
                  {loginType === 'Admin' ? (
                    <React.Fragment>
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Username</label>
                        <input
                          type="text"
                          value={loginData.username}
                          onChange={(event) => setLoginData(prev => ({ ...prev, username: event.target.value }))}
                          className="input-field"
                          placeholder="Masukkan username"
                          required
                          disabled={targetUrl !== ''}
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Password</label>
                        <input
                          type="password"
                          value={loginData.password}
                          onChange={(event) => setLoginData(prev => ({ ...prev, password: event.target.value }))}
                          className="input-field"
                          placeholder="••••••••"
                          required
                          disabled={targetUrl !== ''}
                        />
                      </div>
                      <div className="flex items-center">
                        <input
                          type="checkbox"
                          id="rememberMe"
                          checked={loginData.rememberMe}
                          onChange={(event) => setLoginData(prev => ({ ...prev, rememberMe: event.target.checked }))}
                          className="w-4 h-4 text-red-600 border-gray-300 rounded focus:ring-red-500 cursor-pointer"
                          disabled={targetUrl !== ''}
                        />
                        <label htmlFor="rememberMe" className="ml-2 text-sm font-medium text-gray-600 cursor-pointer">Remember Me</label>
                      </div>
                    </React.Fragment>
                  ) : (
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">ID Pelamar</label>
                      <input
                        type="text"
                        value={loginData.idPelamar}
                        onChange={(event) => setLoginData(prev => ({ ...prev, idPelamar: event.target.value }))}
                        className="input-field"
                        placeholder="Contoh: PLM-171234567"
                        required
                        disabled={targetUrl !== ''}
                      />
                    </div>
                  )}

                  {!targetUrl ? (
                    <button
                      type="submit"
                      disabled={isLoggingIn}
                      className={`w-full py-3 text-white font-bold rounded-xl transition shadow-md ${isLoggingIn ? 'bg-gray-400 cursor-not-allowed' : 'bg-red-600 hover:bg-red-700'}`}
                    >
                      {isLoggingIn ? 'Memverifikasi...' : 'Verifikasi Akun'}
                    </button>
                  ) : (
                    <a
                      href={targetUrl}
                      className="block text-center w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl transition shadow-lg animate-pulse"
                    >
                      ✅ Mulai / Masuk
                    </a>
                  )}

                  {loginStatus.message && (
                    <div className={`text-center text-sm font-bold mt-3 ${loginStatus.type === 'error' ? 'text-red-600' : 'text-green-600'}`}>
                      {loginStatus.message}
                    </div>
                  )}
                </form>
              </div>
            </div>
          )}

          {dialog.isOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[70] p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center animate-[fadeIn_0.2s_ease-out] transform transition-all">
                <div className={`w-20 h-20 rounded-full mx-auto mb-5 flex items-center justify-center text-4xl shadow-inner ${dialog.type === 'success' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
                  {dialog.type === 'success' ? '✅' : '⚠️'}
                </div>
                <h3 className="text-2xl font-black mb-2 text-gray-900">{dialog.title}</h3>
                <p className="text-gray-600 mb-8 text-sm leading-relaxed">{dialog.message}</p>
                <button
                  type="button"
                  onClick={() => setDialog({ ...dialog, isOpen: false })}
                  className="w-full py-3.5 bg-black text-white font-bold rounded-xl hover:bg-gray-800 transition-all shadow-md transform hover:-translate-y-1"
                >
                  Tutup & Lanjutkan
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<JobPortal />);
  </script>
</body>
</html>
